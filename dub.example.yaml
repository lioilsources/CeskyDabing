# ~/.config/dub/dub.yaml (or $DUB_CONFIG). Every key is optional; .env and environment win.
root: /mnt/dabing                 # shared storage, same path on M2 and SPARK
db: ~/.local/share/dub/dub.db     # SQLite on the local disk of M2
workers:
  separate:
    url: http://spark.example:8101   # default: http://$SPARK_HOST:8101
    storage: shared                  # shared | upload
    timeout: 30m
