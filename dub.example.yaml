# ~/.config/dub/dub.yaml (nebo $DUB_CONFIG). Všechny klíče jsou volitelné.
root: /mnt/dabing                        # NFS export z JODA, stejná cesta na M2 i Sparku
db: ~/.local/share/dub/dub.db            # SQLite na lokálním disku M2 (ne na NFS)
workers:
  separate:
    url: http://spark:8101
    storage: shared                      # shared (cesty přes NFS) | upload (fallback bez NFS)
    timeout: 30m
  asr:
    url: http://spark:8102
  tts:
    url: http://spark:8103
