# Python workery dabingu na SPARKu. Spouštění jen přes spark-broker
# (sparkctl), nikdy ručně `docker compose up` mimo lease.
#
#   cd ~/deploy/CeskyDabing && docker compose -f deploy/compose.spark.yaml build separate
#
# /mnt/dabing = NFS export z JODA, stejná cesta jako na M2 (docs/nfs.md).
# Workery běží pod uživatelem, který vlastní soubory na NFS (DUB_UID/DUB_GID).
name: dabing

x-worker: &worker
  restart: "no"
  user: "${DUB_UID:-1000}:${DUB_GID:-1000}"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  volumes:
    - /mnt/dabing:/mnt/dabing
    - ${DUB_MODELS:-../models}:/models
    - ${DUB_SCRATCH:-../scratch}:/scratch

services:
  separate:
    <<: *worker
    image: dabing/separate:latest
    build: ../workers/separate
    ports: ["8101:8101"]
    environment:
      SEPARATE_MODEL: htdemucs_ft
      SEPARATE_IDLE_UNLOAD_S: "600"

  # M1: asr (WhisperX + pyannote, :8102) a tts (MOSS-TTS / XTTS v2, :8103).
