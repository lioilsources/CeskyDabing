# Dubbing model workers on SPARK. Started and stopped only by spark-broker
# (service definitions in docs/spark.md), never by hand outside a lease.
#
# The shared storage is mounted at /mnt/dabing, the same path as on the
# orchestrator host (docs/nfs.md). Workers run as the owner of the shared
# files (DUB_UID/DUB_GID) and are not always-on: restart "no", the model is
# released after SEPARATE_IDLE_UNLOAD_S.
name: dabing

x-worker: &worker
  restart: "no"
  user: "${DUB_UID:-1000}:${DUB_GID:-1000}"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  volumes:
    - ${DUB_ROOT:-/mnt/dabing}:${DUB_ROOT:-/mnt/dabing}
    - ${DUB_MODELS:-../models}:/models
    - ${DUB_SCRATCH:-../scratch}:/scratch

services:
  separate:
    <<: *worker
    container_name: dabing-separate
    image: dabing/separate:latest
    build: {context: ../workers, dockerfile: separate/Dockerfile}
    ports: ["8101:8101"]
    environment:
      SEPARATE_MODEL: htdemucs_ft
      SEPARATE_IDLE_UNLOAD_S: "600"
      SEPARATE_ROOTS: "${DUB_ROOT:-/mnt/dabing}:/scratch"

  asr:
    <<: *worker
    container_name: dabing-asr
    image: dabing/asr:latest
    build: {context: ../workers, dockerfile: asr/Dockerfile}
    ports: ["8105:8105"]
    environment:
      ASR_MODEL: large-v3
      ASR_IDLE_UNLOAD_S: "600"
      ASR_ROOTS: "${DUB_ROOT:-/mnt/dabing}:/scratch"
      HF_TOKEN: "${HF_TOKEN:-}"

  # M1: tts (:8106); 8102–8104 are taken on SPARK.
